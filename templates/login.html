<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - Tasks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar"><a href="/" class="brand">Tasks</a></nav>
  <main class="container" style="max-width: 420px;">
    <div class="card">
      <h2 style="margin-bottom: 8px;">Welcome Back</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px;">Sign in to view all your saved lists.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}<div style="color: var(--danger); margin-bottom: 12px; font-size: 0.9rem;">{{ messages[0] }}</div>{% endif %}
      {% endwith %}

      <form method="POST" action="/login">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px;">Email</label>
          <input type="email" name="email" required placeholder="you@domain.com">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px;">Password</label>
          <input type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none;">Sign Up</a>
      </p>
    </div>
  </main>
</body>
</html>
